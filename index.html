<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css?family=Quicksand:400,500,600,700">

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- Loading Screen -->
    <div id="loading">
        <div class="loader"></div>
        <p>Getting weather information...</p>
    </div>

    <!-- Error Message -->
    <div id="error-message"></div>

    <!-- Weather App -->
    <main id="weather-container">

        <!-- Current Weather -->
        <section class="current-weather-container">

            <div class="location-label">
                📍 Current Location
            </div>

            <div class="city-name">Mumbai</div>

            <!-- Live Time -->
            <div id="current-time" class="current-time">
                --:--:--
            </div>

            <!-- Live Date -->
            <div id="current-date" class="current-date">
                Loading date...
            </div>

            <div class="current-temp-section">

                <img
                    src="https://openweathermap.org/img/wn/10d@2x.png"
                    alt="Weather"
                    class="current-temp-icon"
                >

                <div class="current-temp">
                    --°C
                </div>

            </div>

            <div class="current-temp-desc">
                Loading...
            </div>

            <div class="min-max-container">

                <div class="temperature-box">
                    <span class="temperature-label">High</span>
                    <span class="max-temp">--°C</span>
                </div>

                <div class="temperature-box">
                    <span class="temperature-label">Low</span>
                    <span class="min-temp">--°C</span>
                </div>

            </div>

        </section>


        <!-- Forecast -->
        <section>

            <h2 class="forecast-title">
                Weather Forecast
            </h2>

            <div class="forecast-container">
                <!-- Forecast cards generated by JavaScript -->
            </div>

        </section>

    </main>

    <script src="./main.js"></script>

</body>
</html>
